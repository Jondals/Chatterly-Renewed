# .github/actions/build-web/action.yml
# * The steps the app builds share. mode "web" (the default) installs everything and builds the web app that the desktop apps
#   carry inside them (frontend/dist). mode "desktop" only installs the tools and the root and desktop packages (the web app comes ready
#   from the `web` job), so Windows and Linux do not build it again. Called with `uses: ./.github/actions/build-web`.
# ! Every action is pinned to the exact commit of its release (the tag only says which one), so a moved tag cannot change
#   what runs. To update one, look up the commit of the new release and change both the hash and the comment.
name: Build the web app
description: Installs pnpm, Node and the packages, and builds the web app (or only prepares the desktop build).

inputs:
  mode:
    description: "web (install everything and build the web app) or desktop (only the desktop packages)"
    default: web

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      with:
        version: 12.9.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend/pnpm-lock.yaml
          desktop/pnpm-lock.yaml
    # The downloads that never change between builds (the browser of the web build, Electron and the installer tools).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/AppData/Local/ms-playwright
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/.cache/ms-playwright
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/Library/Caches/ms-playwright
        key: desktop-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'desktop/pnpm-lock.yaml') }}
        restore-keys: desktop-tools-${{ runner.os }}-
    - name: Install
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        if [ "${{ inputs.mode }}" = web ]; then
          pnpm --dir frontend install --frozen-lockfile
        fi
        pnpm --dir desktop install --frozen-lockfile
    # The web build draws a copy of the sign-in screen with a real browser (frontend/scripts/postbuild.mjs).
    - name: Install the browser the web build needs
      if: inputs.mode == 'web'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - name: Build the web app
      if: inputs.mode == 'web'
      shell: bash
      run: pnpm --dir frontend build
