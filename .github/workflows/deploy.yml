# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# .github/workflows/deploy.yml
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# * Every push to the main branch (master or main) updates the server: it downloads the new code and rebuilds the
# container, which holds both the backend and the web app. Secrets to create in GitHub (Settings > Secrets and variables
# > Actions): SSH_HOST (IP or domain), SSH_USER (for example ubuntu), SSH_KEY (the whole private key) and, if it is not
# 22, SSH_PORT. It can also be started by hand from the Actions tab.
# ! SSH_KEY is a PRIVATE key: use one made only for this (ssh-keygen -t ed25519), never your personal one.
name: Deploy Chatterly-Renewed to VPS

on:
  push:
    branches: [master, main]
    # * The desktop and mobile apps are built and published on their own; changing them must not redeploy the server.
    paths-ignore:
      - 'desktop/**'
      - 'mobile/**'
  workflow_dispatch:

# The job only needs to read the repository (the server is reached with the SSH key, not with the token of GitHub).
permissions:
  contents: read

# * One update at a time: a push that arrives while another is running waits for it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # ! Only the main branch is ever deployed to the server, also when it is started by hand: a beta (or any other branch) never
    #   reaches production from here. The beta installers go to the server through their own upload route (desktop.yml).
    if: github.ref_name == 'master' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Update the server over SSH
        # ! This step receives the private key of the server: the action is pinned to the exact commit of v1.0.3, so a moved
        #   tag cannot change what runs with it. To update it, look up the commit of the new release and change both.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ~/ChatterlyRenewed
            # ? The server always fetches from the repository that runs this workflow (public, no credentials): when the project moved
            #   to another repository, the folder of the server kept pointing at the old one and the fetch failed.
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            if docker compose version >/dev/null 2>&1; then COMPOSE="docker compose"; else COMPOSE="docker-compose"; fi
            # ! The server is reset to GitHub (git reset --hard): files not in Git (.env, docker-compose.override.yml) survive.
            # * Build first (the site keeps running), then replace the container. Removing the old one before creating the
            # new one avoids the "KeyError: 'ContainerConfig'" crash of docker-compose 1.29 when it recreates a container.
            $COMPOSE build app
            $COMPOSE rm -sf app
            $COMPOSE up -d app
            # ? The TURN relay (when it was set up with deploy/turn-setup.sh) is started if it is not running, and left as it is
            # otherwise (recreating it with docker-compose 1.x fails with 'ContainerConfig'; deploy/turn-setup.sh replaces it).
            if grep -q '^TURN_SECRET=.' .env; then $COMPOSE --profile turn up -d --no-recreate turn; fi
            docker image prune -f
