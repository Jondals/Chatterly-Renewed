# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# .github/workflows/desktop.yml
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# * One release for the whole project. You raise the version, commit and push, and that is all: this workflow builds the
#   desktop app for Windows (installer) and Linux (AppImage) and attaches them to ONE GitHub Release "v<version>"
#   (the version in desktop/package.json). The notes are a short summary with a link to the CHANGELOG
#   (desktop/scripts/release-notes.mjs). Installed apps look for updates there. A platform that already has its files in the
#   release is skipped, so a push that did not raise the version does nothing. deploy.yml updates the server on the same push.
# * Two channels, two branches:
#     master / main  the STABLE release "v2.32.0", marked as the latest one. Everybody's app is offered it.
#     beta           a PRE-RELEASE "v2.32.0-beta.<n>" (desktop/scripts/beta-version.mjs gives the build that
#                    version). Only the apps of the beta testers (Settings > Administration) look at pre-releases.
#   To publish a beta: push to the branch "beta". To publish it for everybody: merge "beta" into master.
# * How a release is made: `prepare` creates it as a DRAFT (nobody sees it half-done), each platform job uploads its files,
#   and `publish` makes it public only when every job has finished. A failed build leaves the draft; the next push (or "Run
#   workflow") finishes it, because only the missing platforms are built again.
# * Only the installers are uploaded, plus the *.yml of the channel (a few hundred bytes: the installed apps need it to find
#   the new version and to check its sha512). No blockmap: it is only for differential downloads and doubled the upload.
# * By hand (Actions tab > Run workflow) it builds the Microsoft Store package instead and keeps it as a download.
#   Secrets for the Store (Settings > Secrets and variables > Actions): STORE_IDENTITY_NAME, STORE_PUBLISHER and
#   STORE_PUBLISHER_DISPLAY_NAME, the three values of "Product identity" in Partner Center.
# ! The installers are NOT signed yet, so Windows shows its SmartScreen warning on direct downloads. The Store route signs it.
#
# * To add a platform (Android, macOS, iOS): copy the `linux` job, change `runs-on`, the build step and the file names, add a
#   check for its files in `prepare` (an output like `linux`), and list the job in `publish`'s `needs`.
#
# * Security of this file:
#   - The builds (which run the code of many npm packages) get NO token. Only the small steps that run the GitHub CLI
#     and nothing else receive GITHUB_TOKEN. The checkout does not leave the token in the folder either.
#   - Every action is pinned to the exact commit of its release (the tag only says which one), so a moved tag cannot
#     change what runs. To update one, look up the commit of the new release and change both the hash and the comment.
#   - It only runs for pushes to this repository's branches, never for pull requests.
name: Build the apps

on:
  push:
    branches: [master, main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release
    outputs:
      version: ${{ steps.version.outputs.version }}
      beta: ${{ steps.version.outputs.beta }}
      label: ${{ steps.version.outputs.label }}
      number: ${{ steps.version.outputs.number }}
      windows: ${{ steps.version.outputs.windows }}
      linux: ${{ steps.version.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which apps does this version still need?
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          BETA=false
          # What people read: "2.32.0" (release) or "2.32.0-b1" (the first beta of it, b2 the next...). The tag is
          # "v2.32.0-beta.1", "-beta.2"...: the updater needs a version it can order (b10 < b2 as text, and 01 is not a valid
          # number) and only understands the channels alpha and beta. The number counts the betas of that version; a retry of
          # the same push (same commit) finds its draft and keeps its number.
          LABEL="$VERSION"
          if [ "$BRANCH" = beta ]; then
            BETA=true
            BASE="${VERSION%%-*}"
            TAG=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name | startswith(\"v$BASE-beta.\")) | select(.target_commitish == \"$GITHUB_SHA\")][0].tag_name // empty")
            if [ -n "$TAG" ]; then
              VERSION="${TAG#v}"
            else
              LAST=$(gh release list --limit 200 --json tagName --jq "[.[] | select(.tagName | startswith(\"v$BASE-beta.\")) | .tagName | sub(\"^.*beta[.]\"; \"\") | tonumber] | max // 0")
              VERSION="$BASE-beta.$((LAST + 1))"
            fi
            LABEL="$BASE-b${VERSION##*.}"
          fi
          echo "number=${VERSION##*.}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)
          # A platform is done when its installer and its update file are already in the release.
          if echo "$ASSETS" | grep -qx "Chatterly-$LABEL.exe" && echo "$ASSETS" | grep -qx '\(latest\|beta\).yml'; then
            echo "windows=false" >> "$GITHUB_OUTPUT"
          else
            echo "windows=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$ASSETS" | grep -qx "Chatterly-$LABEL.AppImage" && echo "$ASSETS" | grep -qx '\(latest\|beta\)-linux.yml'; then
            echo "linux=false" >> "$GITHUB_OUTPUT"
          else
            echo "linux=true" >> "$GITHUB_OUTPUT"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            NAME="v$LABEL"
            FLAGS=""
            if [ "$BETA" = true ]; then FLAGS="--prerelease"; fi
            TITLE="Chatterly $NAME"
            node desktop/scripts/release-notes.mjs "$VERSION" "$NAME" > release-notes.md
            gh release create "v$VERSION" --draft $FLAGS --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file release-notes.md
          fi

  # The web app is built ONCE and both platforms carry that same build (it was built twice before).
  web:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true' || needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the beta build
        if: needs.prepare.outputs.beta == 'true'
        run: node desktop/scripts/beta-version.mjs "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.label }}"
      - uses: ./.github/actions/build-web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: frontend/dist/frontend/browser
          retention-days: 1

  windows:
    needs: [prepare, web]
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: write # to attach the installer to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the beta build
        if: needs.prepare.outputs.beta == 'true'
        shell: bash
        run: node desktop/scripts/beta-version.mjs "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.label }}"
      - uses: ./.github/actions/build-web
        with:
          mode: desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: frontend/dist/frontend/browser
      # The shell checks take minutes and run on your machine with `pnpm test`: only the stable release waits for them here.
      - name: Check the desktop shell
        if: needs.prepare.outputs.beta != 'true'
        run: pnpm --dir desktop test
      - name: Build the installer (no token here)
        env:
          CHATTERLY_LABEL: ${{ needs.prepare.outputs.label }}
        run: pnpm --dir desktop dist
      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ needs.prepare.outputs.label }}
          BETA: ${{ needs.prepare.outputs.beta }}
        run: |
          # The update file is latest.yml on the stable channel and beta.yml on the beta one (the installed apps of the beta
          # look for beta.yml, so a beta build always uploads it under that name, whatever electron-builder called it).
          YML=desktop/dist/latest.yml
          if [ ! -f "$YML" ]; then YML=desktop/dist/beta.yml; fi
          if [ "$BETA" = true ]; then
            [ "$YML" = desktop/dist/beta.yml ] || cp "$YML" desktop/dist/beta.yml
            YML=desktop/dist/beta.yml
          fi
          ls -l desktop/dist
          for FILE in "Chatterly-$LABEL.exe" "$(basename "$YML")"; do
            gh release delete-asset "v$VERSION" "$FILE" --yes 2>/dev/null || true
          done
          gh release upload "v$VERSION" "desktop/dist/Chatterly-$LABEL.exe" "$YML" --clobber

  linux:
    needs: [prepare, web]
    if: needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the packages to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the beta build
        if: needs.prepare.outputs.beta == 'true'
        run: node desktop/scripts/beta-version.mjs "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.label }}"
      - uses: ./.github/actions/build-web
        with:
          mode: desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: frontend/dist/frontend/browser
      - name: Build the AppImage (no token here)
        env:
          CHATTERLY_LABEL: ${{ needs.prepare.outputs.label }}
        run: pnpm --dir desktop dist:linux
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ needs.prepare.outputs.label }}
          BETA: ${{ needs.prepare.outputs.beta }}
        run: |
          # The update file is latest-linux.yml on the stable channel and beta-linux.yml on the beta one (see the Windows job).
          YML=desktop/dist/latest-linux.yml
          if [ ! -f "$YML" ]; then YML=desktop/dist/beta-linux.yml; fi
          if [ "$BETA" = true ]; then
            [ "$YML" = desktop/dist/beta-linux.yml ] || cp "$YML" desktop/dist/beta-linux.yml
            YML=desktop/dist/beta-linux.yml
          fi
          ls -l desktop/dist
          for FILE in "Chatterly-$LABEL.AppImage" "$(basename "$YML")"; do
            gh release delete-asset "v$VERSION" "$FILE" --yes 2>/dev/null || true
          done
          gh release upload "v$VERSION" "desktop/dist/Chatterly-$LABEL.AppImage" "$YML" --clobber

  publish:
    # Makes the release public once every platform job that had to run has finished well.
    needs: [prepare, web, windows, linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BETA: ${{ needs.prepare.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            gh release edit "v$VERSION" --draft=false --prerelease
          else
            gh release edit "v$VERSION" --draft=false --latest
          fi

  store:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-web
      - name: Build the Microsoft Store package
        run: pnpm --dir desktop dist:store
        env:
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatterly-store-package
          path: desktop/dist/*.appx
