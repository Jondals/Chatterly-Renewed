# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# .github/workflows/desktop.yml
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# * Two channels, two places:
#     master / main  the STABLE release "v2.32.0" in GitHub Releases, marked as the latest one. Everybody's app is offered it.
#     beta           "2.32.0-b1", "-b2"... (the tag-like version is "2.32.0-beta.<n>": desktop/scripts/beta-version.mjs). It is NOT
#                    published in GitHub: the installer goes to the Chatterly server (routes/beta-files.ts), and only the beta
#                    testers' apps can download it. The server numbers the betas of a version 1, 2, 3...
#   To publish a beta: push to the branch "beta". To publish it for everybody: merge "beta" into master.
# * Builds and publishing are separated on purpose:
#     prepare   decides the version (and creates the DRAFT of a stable release). No npm code runs here.
#     web / windows / linux / mac / android   build, and only build: NO secret and a read-only token. They hand over the files
#               as artifacts.
#     release   the only job with the secrets (the signing key, the token of the release, the upload secret of the beta server). It
#               runs no code from npm: it signs the manifests (desktop/scripts/sign-update.mjs), uploads and publishes.
# * Every update manifest (latest.yml / beta.yml) is SIGNED with an Ed25519 key kept in the secret UPDATE_SIGNING_KEY (environment
#   "update-signing", where you can also require your approval). The apps check that signature with the public key they carry
#   (desktop/src/update-verify.cjs), so nobody who gets into GitHub or into the server can pass off another installer.
# * Secrets (Settings > Secrets and variables > Actions): UPDATE_SIGNING_KEY (the private key, PEM), BETA_UPLOAD_TOKEN (the same
#   value as in the .env of the server). Variable: BETA_SERVER_URL (optional, the server address).
# * A stable release is made as a DRAFT (nobody sees it half-done) and made public only when every job has finished. A failed
#   build leaves the draft; the next push (or "Run workflow") finishes it, because only the missing platforms are built again.
# * Only the installers are uploaded, plus the manifest of the channel and its signature (a few hundred bytes: the installed apps need
#   them to find the new version and to check it). No blockmap: it is only for differential downloads and doubled the upload.
# * By hand (Actions tab > Run workflow) it builds the Microsoft Store package instead and keeps it as a download.
#   Secrets for the Store (Settings > Secrets and variables > Actions): STORE_IDENTITY_NAME, STORE_PUBLISHER and
#   STORE_PUBLISHER_DISPLAY_NAME, the three values of "Product identity" in Partner Center.
# ! The installers are NOT signed yet, so Windows shows its SmartScreen warning on direct downloads. The Store route signs it.
#
# * Android (stable: the APK goes to the release; beta: the APK and beta-android.yml go to the beta server). The `android` job builds the APK UNSIGNED, with
#   no secret, and checks it (mobile/test/mobile.mjs). `release` signs it with apksigner and the keystore of the secrets
#   ANDROID_KEYSTORE_B64 (the .p12 file in base64) and ANDROID_KEYSTORE_PASSWORD, refuses it unless its certificate is exactly
#   the one in mobile/release-certificate.sha256 (Android only installs an update signed with the SAME key, so an APK signed with
#   any other key must never be published), and attaches Chatterly-<v>.apk to the release.
#
# * macOS (`mac` job, on a Mac runner): one universal app (Intel and Apple Silicon) as Chatterly-<v>.dmg (what people install)
#   and Chatterly-<v>.zip (listed in latest-mac.yml). It is signed AD HOC (not by Apple: that needs a paid account), so the first
#   time macOS asks to allow it in System Settings > Privacy & Security, and the app updates by downloading the .dmg the signed
#   manifest lists and checking its sha512 (desktop/src/updater.cjs).
# * A release is published only when EVERY platform built well, all at once (the draft is made public at the end), and its files
#   are uploaded in this order: Windows, Linux, macOS, Android, then the manifests.
#
# * To add a platform (iOS): copy the `linux` job, change `runs-on`, the build step and the file names, add a
#   check for its files in `prepare` (an output like `linux`), and list the job in `release`'s `needs` (and its artifact in that job).
#
# * Security of this file:
#   - The builds (which run the code of many npm packages) get NO secret and a read-only token. Only the `release` job (no npm code)
#     receives the signing key, the upload secret and a write token. The checkout does not leave the token in the folder either.
#   - Every action is pinned to the exact commit of its release (the tag only says which one), so a moved tag cannot
#     change what runs. To update one, look up the commit of the new release and change both the hash and the comment.
#   - It only runs for pushes to this repository's branches, never for pull requests.
name: Build the apps

on:
  push:
    branches: [master, main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft of a stable release
    outputs:
      version: ${{ steps.version.outputs.version }}
      beta: ${{ steps.version.outputs.beta }}
      label: ${{ steps.version.outputs.label }}
      number: ${{ steps.version.outputs.number }}
      windows: ${{ steps.version.outputs.windows }}
      linux: ${{ steps.version.outputs.linux }}
      mac: ${{ steps.version.outputs.mac }}
      android: ${{ steps.version.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which apps does this version still need?
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BETA_UPLOAD_TOKEN: ${{ secrets.BETA_UPLOAD_TOKEN }}
          BETA_URL: ${{ vars.BETA_SERVER_URL || 'https://chatterlyrenewed.duckdns.org' }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          BETA=false
          NUMBER=0
          # What people read: "2.32.0" (release) or "2.32.0-b1" (the first beta of it, b2 the next...). The version the updater
          # orders is "2.32.0-beta.<n>": it needs a number it can order (b10 < b2 as text, and 01 is not a valid number) and
          # only understands the channels alpha and beta. The server counts the betas of a version and gives the same number to
          # the same commit, so a retry does not skip one.
          LABEL="$VERSION"
          if [ "$BRANCH" = beta ]; then
            BETA=true
            BASE="${VERSION%%-*}"
            NUMBER=$(curl -fsS --retry 3 -H "Authorization: Bearer $BETA_UPLOAD_TOKEN" \
              "$BETA_URL/api/beta/next?base=$BASE&sha=$COMMIT" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).number")
            case "$NUMBER" in ''|*[!0-9]*) echo "The server gave no beta number"; exit 1 ;; esac
            VERSION="$BASE-beta.$NUMBER"
            LABEL="$BASE-b$NUMBER"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          if [ "$BETA" = true ]; then
            # A beta has no release in GitHub: both platforms are always built.
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "linux=true" >> "$GITHUB_OUTPUT"
            echo "mac=true" >> "$GITHUB_OUTPUT"
            # The Android beta goes to the beta server too (APK + beta-android.yml), only for the testers.
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)
          # A platform is done when its installer and its manifest (which carries the signature inside) are already in the release.
          if echo "$ASSETS" | grep -qx "Chatterly-$LABEL.exe" && echo "$ASSETS" | grep -qx 'latest.yml'; then
            echo "windows=false" >> "$GITHUB_OUTPUT"
          else
            echo "windows=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$ASSETS" | grep -qx "Chatterly-$LABEL.AppImage" && echo "$ASSETS" | grep -qx 'latest-linux.yml'; then
            echo "linux=false" >> "$GITHUB_OUTPUT"
          else
            echo "linux=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$ASSETS" | grep -qx "Chatterly-$LABEL.dmg" && echo "$ASSETS" | grep -qx 'latest-mac.yml'; then
            echo "mac=false" >> "$GITHUB_OUTPUT"
          else
            echo "mac=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$ASSETS" | grep -qx "Chatterly-$LABEL.apk"; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            NAME="v$LABEL"
            node desktop/scripts/release-notes.mjs "$VERSION" "$NAME" > release-notes.md
            gh release create "v$VERSION" --draft --target "$COMMIT" \
              --title "Chatterly $NAME" --notes-file release-notes.md
          fi

  # The web app is built ONCE and both platforms carry that same build (it was built twice before).
  web:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true' || needs.prepare.outputs.linux == 'true' || needs.prepare.outputs.mac == 'true' || needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the beta build
        if: needs.prepare.outputs.beta == 'true'
        run: node desktop/scripts/beta-version.mjs "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.label }}"
      - uses: ./.github/actions/build-web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: frontend/dist/frontend/browser
          retention-days: 1

  windows:
    needs: [prepare, web]
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: read # the build gets no way to write anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the beta build
        if: needs.prepare.outputs.beta == 'true'
        shell: bash
        run: node desktop/scripts/beta-version.mjs "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.label }}"
      - uses: ./.github/actions/build-web
        with:
          mode: desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: frontend/dist/frontend/browser
      # The shell checks take minutes and run on your machine with `pnpm test`: only the stable release waits for them here.
      - name: Check the desktop shell
        if: needs.prepare.outputs.beta != 'true'
        run: pnpm --dir desktop test
      - name: Build the installer (no token here)
        env:
          CHATTERLY_LABEL: ${{ needs.prepare.outputs.label }}
        run: pnpm --dir desktop dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: |
            desktop/dist/Chatterly-${{ needs.prepare.outputs.label }}.exe
            desktop/dist/latest.yml
            desktop/dist/beta.yml
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: [prepare, web]
    if: needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the build gets no way to write anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the beta build
        if: needs.prepare.outputs.beta == 'true'
        run: node desktop/scripts/beta-version.mjs "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.label }}"
      - uses: ./.github/actions/build-web
        with:
          mode: desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: frontend/dist/frontend/browser
      - name: Build the AppImage (no token here)
        env:
          CHATTERLY_LABEL: ${{ needs.prepare.outputs.label }}
        run: pnpm --dir desktop dist:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: |
            desktop/dist/Chatterly-${{ needs.prepare.outputs.label }}.AppImage
            desktop/dist/latest-linux.yml
            desktop/dist/beta-linux.yml
          if-no-files-found: error
          retention-days: 1

  mac:
    needs: [prepare, web]
    if: needs.prepare.outputs.mac == 'true'
    runs-on: macos-latest
    permissions:
      contents: read # the build gets no way to write anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version of the beta build
        if: needs.prepare.outputs.beta == 'true'
        run: node desktop/scripts/beta-version.mjs "${{ needs.prepare.outputs.number }}" "${{ needs.prepare.outputs.label }}"
      - uses: ./.github/actions/build-web
        with:
          mode: desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: frontend/dist/frontend/browser
      - name: Build the disk image (no token here)
        env:
          CHATTERLY_LABEL: ${{ needs.prepare.outputs.label }}
          # ! No certificate of Apple: the app is signed ad hoc (desktop/package.json, mac.identity "-").
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --dir desktop dist:mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-mac
          path: |
            desktop/dist/Chatterly-${{ needs.prepare.outputs.label }}.dmg
            desktop/dist/Chatterly-${{ needs.prepare.outputs.label }}.zip
            desktop/dist/latest-mac.yml
            desktop/dist/beta-mac.yml
          if-no-files-found: error
          retention-days: 1

  android:
    needs: [prepare, web]
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the build gets no way to write anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      # Gradle 8.14 (the one of Capacitor 8) runs on Java up to 24: JDK 21, as on the computer that builds it by hand.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: frontend/dist/frontend/browser
      - name: Put the web app inside the Android project (no token here)
        run: |
          pnpm --dir mobile install --frozen-lockfile
          node mobile/scripts/prepare-web.mjs
          pnpm --dir mobile exec cap sync android
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build the APK, unsigned (no token here)
        env:
          CHATTERLY_LABEL: ${{ needs.prepare.outputs.label }}
        working-directory: mobile/android
        run: bash gradlew --no-daemon assembleRelease
      - name: Check the APK (manifest, permissions, code, the web app inside)
        env:
          CHATTERLY_LABEL: ${{ needs.prepare.outputs.label }}
        run: node mobile/test/mobile.mjs --web frontend/dist/frontend/browser
      - name: Name the APK
        run: |
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "mobile/dist/Chatterly-${{ needs.prepare.outputs.label }}-unsigned.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: mobile/dist/Chatterly-${{ needs.prepare.outputs.label }}-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  release:
    # Signs the manifests and publishes: a stable release in GitHub, a beta in the Chatterly server. The only job with secrets, and
    # it runs only after every platform that had to be built has finished well.
    needs: [prepare, web, windows, linux, mac, android]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    environment: update-signing
    permissions:
      contents: write # to attach the files to the draft of a stable release and publish it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.windows == 'true' || needs.prepare.outputs.linux == 'true' || needs.prepare.outputs.mac == 'true' || needs.prepare.outputs.android == 'true'
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Sign the manifests and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHATTERLY_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          BETA_UPLOAD_TOKEN: ${{ secrets.BETA_UPLOAD_TOKEN }}
          BETA_URL: ${{ vars.BETA_SERVER_URL || 'https://chatterlyrenewed.duckdns.org' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BETA: ${{ needs.prepare.outputs.beta }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The manifest of a channel is latest*.yml (stable) or beta*.yml (beta): whatever electron-builder called it, it is
          # published under the name that channel's apps look for.
          CHANNEL=latest
          if [ "$BETA" = true ]; then CHANNEL=beta; fi
          mkdir out
          for FILE in dist/*.exe dist/*.AppImage dist/*.dmg dist/*.zip; do cp "$FILE" out/; done
          for FILE in dist/latest.yml dist/beta.yml; do if [ -f "$FILE" ]; then cp "$FILE" "out/$CHANNEL.yml"; fi; done
          for FILE in dist/latest-linux.yml dist/beta-linux.yml; do if [ -f "$FILE" ]; then cp "$FILE" "out/$CHANNEL-linux.yml"; fi; done
          for FILE in dist/latest-mac.yml dist/beta-mac.yml; do if [ -f "$FILE" ]; then cp "$FILE" "out/$CHANNEL-mac.yml"; fi; done
          # ! Android: the APK is signed here (never in the job that ran npm and Gradle), with the keystore written to a private
          # temporary file that is deleted at the end. Only an APK whose certificate is the one of mobile/release-certificate.sha256
          # is published: Android only installs an update signed with the same key as the installed app.
          APKS=(dist/*-unsigned.apk)
          if [ ${#APKS[@]} -gt 0 ] && [ -z "$ANDROID_KEYSTORE_B64" ]; then
            # Without the keystore the desktop apps are still published; the APK waits (the next push builds it again).
            echo "::warning::The secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD are missing: the APK is not published."
            APKS=()
          fi
          if [ ${#APKS[@]} -gt 0 ]; then
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            KEYSTORE="$RUNNER_TEMP/android-release.p12"
            trap 'rm -f "$KEYSTORE"' EXIT
            (umask 077 && printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE")
            EXPECTED=$(tr -d ' \r\n' < mobile/release-certificate.sha256)
            for UNSIGNED in "${APKS[@]}"; do
              NAME="$(basename "$UNSIGNED" -unsigned.apk).apk"
              "$BUILD_TOOLS/zipalign" -c -p 4 "$UNSIGNED"
              "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
                --ks-key-alias chatterly --out "out/$NAME" "$UNSIGNED"
              "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "out/$NAME" > apk-verify.txt
              grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-verify.txt
              ACTUAL=$(grep -m1 'certificate SHA-256 digest' apk-verify.txt | awk '{print $NF}')
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "The APK was signed with another certificate ($ACTUAL), not the one of the app ($EXPECTED)"
                exit 1
              fi
              rm -f "out/$NAME.idsig"
            done
            rm -f "$KEYSTORE"
          fi
          MANIFESTS=(out/*.yml)
          if [ ${#MANIFESTS[@]} -gt 0 ]; then
            node desktop/scripts/sign-update.mjs "${MANIFESTS[@]}"
          fi
          if [ "$BETA" = true ]; then
            # The server keeps no record of who downloads. Installers first, then manifests: an app that sees a
            # manifest finds everything it points to.
            send() {
              curl -fsS --retry 3 --retry-all-errors -X PUT -H "Authorization: Bearer $BETA_UPLOAD_TOKEN" \
                -H 'Content-Type: application/x-chatterly-beta' --data-binary "@$1" \
                "$BETA_URL/api/beta/upload/$(basename "$1")" > /dev/null
              echo "uploaded $(basename "$1")"
            }
            for FILE in out/*.exe out/*.AppImage; do send "$FILE"; done
            # macOS: a server that still runs an older version refuses these names; the other betas are published anyway.
            MAC_OK=true
            for FILE in out/*.dmg out/*.zip; do send "$FILE" || MAC_OK=false; done
            for FILE in out/*.yml; do
              if [ "$(basename "$FILE")" = beta-mac.yml ]; then
                if [ "$MAC_OK" = true ]; then send "$FILE" || echo "::warning::The beta server did not take the macOS beta."; fi
              else
                send "$FILE"
              fi
            done
            # Android: the APK, then beta-android.yml (version, file, SHA-256). The app installs it only if Android confirms it is
            # newer and signed with the same certificate, so it needs no Ed25519 signature. A server that still runs an older
            # version refuses these names: the desktop beta is published anyway and the APK waits for the next beta.
            for APK in out/*.apk; do
              NAME=$(basename "$APK")
              printf 'version: %s\npath: %s\nsha256: %s\n' "${NAME#Chatterly-}" "$NAME" "$(sha256sum "$APK" | cut -d' ' -f1)" \
                | sed 's/^version: \(.*\)\.apk$/version: \1/' > out/beta-android.yml
              if send "$APK" && send out/beta-android.yml; then
                echo "Android beta published: $NAME"
              else
                echo "::warning::The beta server did not take the APK (it may run an older version): the Android beta waits."
              fi
            done
          else
            # Installers first, in this order (Windows, Linux, macOS, Android), then the manifests: an app that sees a manifest
            # finds the installer it points to. The signature travels inside each manifest (last line).
            for FILE in out/*.exe out/*.AppImage out/*.dmg out/*.zip out/*.apk out/*.yml; do
              gh release delete-asset "v$VERSION" "$(basename "$FILE")" --yes 2>/dev/null || true
              gh release upload "v$VERSION" "$FILE"
            done
            gh release edit "v$VERSION" --draft=false --latest
          fi

  store:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-web
      - name: Build the Microsoft Store package
        run: pnpm --dir desktop dist:store
        env:
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatterly-store-package
          path: desktop/dist/*.appx
