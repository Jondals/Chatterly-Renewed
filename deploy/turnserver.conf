# deploy/turnserver.conf
# TEMPLATE of the configuration of the TURN relay (coturn) of the calls.
# ! Do NOT put real values here: this file is in Git.
# `bash deploy/turn-setup.sh` fills the placeholders (CHANGE_ME, PUBLIC_IP, PRIVATE_IP, DOMAIN_HERE) and writes the result
# to deploy/turnserver.generated.conf (owner + group 65534 of coturn, mode 640, ignored by Git), which docker-compose.yml mounts
# into the container.
# For a coturn installed with the system package, copy this file to /etc/turnserver.conf and replace the placeholders by hand.
#
# ? What can the relay see? The network addresses of the people who use it and how much they send.
# * It cannot read the audio and video: the app encrypts them end to end before they reach the relay.
# ! TURN hides the addresses of the people from EACH OTHER, not from whoever runs the relay.

listening-port=3478
listening-ip=PRIVATE_IP
fingerprint

# * Short-lived credentials: the backend signs "<expiry>:<user>" with the shared secret (TURN_SECRET) and coturn checks it.
# No static user/password exists, so the relay cannot be used without a valid, recent credential from the backend.
use-auth-secret
# ! The same value as TURN_SECRET of the backend (a long random text: openssl rand -hex 32).
static-auth-secret=CHANGE_ME
realm=DOMAIN_HERE

# The public IP of the machine, and its private one (Oracle machines sit behind a NAT): external-ip=PUBLIC/PRIVATE
external-ip=PUBLIC_IP/PRIVATE_IP
# The range of ports used by the relays. With RELAY_ONLY=1 it does NOT need to be public (only UDP and TCP 3478 do); open it,
# UDP, in the VCN and in the host firewall only if calls may also connect without the relay.
min-port=49152
max-port=49252

# * No admin interface, no DTLS listener (the media is already encrypted by the app), no old TLS versions.
no-cli
no-dtls
no-tlsv1
no-tlsv1_1
# ? TLS listener ("turns:", port 5349). The line below turns it OFF. `bash deploy/turn-setup.sh --tls` replaces it by the TLS
#   settings, so that whoever watches the network (a mobile operator, a provider, a Wi-Fi owner) cannot read the user names
#   or the control messages of the relay. They still see that a person talks to this server, and how much.
no-tls

# Only UDP relaying (what WebRTC media needs); no TCP relaying towards the peers.
no-tcp-relay
no-multicast-peers
no-rfc5780
no-stun-backward-compatibility
no-software-attribute
stale-nonce=600

# ! Nobody can use the relay to reach the machine, its network or the cloud metadata service (169.254.169.254).
#   Do not remove these lines: without them the relay is a door into the private network.
# The only exception is the machine's own private address, which is needed so that two people who both use this relay can
# reach each other's relayed address (the public address is translated to the private one before the check).
allowed-peer-ip=PRIVATE_IP
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# * Abuse limits: allocations per credential and in total, and bandwidth per allocation (bytes per second).
user-quota=12
total-quota=1200
max-bps=1500000

# Logs go to the standard output (docker rotates them, see docker-compose.yml). No verbose mode: it prints addresses.
# ? `bash deploy/turn-setup.sh --no-logs` replaces the next line by "no-stdout-log": the relay writes nothing at all.
log-file=stdout
simple-log
