<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob: mediastream:"
    />
    <title>overlay</title>
  </head>
  <body style="margin: 0; background: transparent; overflow: hidden">
    <video
      id="v"
      autoplay
      muted
      playsinline
      style="width: 100%; height: 100%; object-fit: cover; border-radius: 14px; opacity: 0.95"
    ></video>
    <script src="overlay.js"></script>
  </body>
</html>
