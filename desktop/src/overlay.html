<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src blob: mediastream:"
    />
    <title>Chatterly overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="toast" class="toast" hidden></div>
    <!-- Unlocked (like the overlay of Discord): the screen dims, every widget shows with its title and its pin. -->
    <div id="backdrop" class="backdrop" hidden></div>
    <div id="bar" class="bar" hidden>
      <b id="title" class="title"></b>
      <div class="group" role="radiogroup">
        <button type="button" data-size="small"></button>
        <button type="button" data-size="medium"></button>
        <button type="button" data-size="large"></button>
      </div>
      <button id="only" type="button" class="chip"></button>
      <button id="names" type="button" class="chip"></button>
      <span id="hint" class="hint"></span>
    </div>
    <div id="close" class="close" hidden>
      <button id="done" type="button" class="close-button"></button>
      <span id="keys" class="close-keys"></span>
    </div>
    <div id="widgets"></div>
    <script src="overlay.js"></script>
  </body>
</html>
