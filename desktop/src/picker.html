<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'"
    />
    <title>Share your screen</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06070b;
        color: #e8eaf2;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 16px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      #grid {
        flex: 1;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
        align-content: start;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border: 1px solid #262a3a;
        border-radius: 10px;
        background: #0e1019;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .card:hover,
      .card:focus-visible {
        border-color: #7c8cff;
        outline: none;
      }
      .card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #000;
        border-radius: 6px;
      }
      .card span {
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      #tabs[hidden] {
        display: none;
      }
      .tab {
        padding: 7px 14px;
        border: 1px solid #262a3a;
        border-radius: 8px;
        background: transparent;
        color: #9aa3b5;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .tab.is-on {
        border-color: #7c8cff;
        background: #14172a;
        color: #e8eaf2;
      }
      .empty {
        grid-column: 1 / -1;
        margin: 24px 0;
        color: #9aa3b5;
        font-size: 13px;
        text-align: center;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 12px;
      }
      .sound {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .sound input {
        width: 16px;
        height: 16px;
        accent-color: #7c8cff;
      }
      #cancel {
        padding: 8px 16px;
        border: 1px solid #262a3a;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Choose what to share</h1>
    <div id="tabs" role="tablist">
      <button id="tab-screen" class="tab is-on" data-tab="screen" role="tab" type="button">
        Entire screen
      </button>
      <button id="tab-window" class="tab" data-tab="window" role="tab" type="button">
        A window
      </button>
    </div>
    <div id="grid"></div>
    <footer>
      <label class="sound"
        ><input id="audio" type="checkbox" /><span id="audio-label"
          >Share the sound of the computer</span
        ></label
      >
      <button id="cancel" type="button">Cancel</button>
    </footer>
  </body>
</html>
