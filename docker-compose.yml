# ════════════════════════════════════════════════════════════════════════════════════════════════════
# docker-compose.yml
# ════════════════════════════════════════════════════════════════════════════════════════════════════
# * The app in one container (API and web app). The app listens only on this machine: 3000 (API) and 3001 (web).
#   cp deploy/.env.docker.example .env   (write your domain and secrets)
#   docker compose --profile caddy up -d --build     (the app plus a Caddy that gets the HTTPS certificate itself)
# ! Calls need a TURN relay (RELAY_ONLY=1 makes it mandatory): Cloudflare's managed TURN, see deploy/.env.docker.example.
# * Production runs on a TrueNAS behind a Cloudflare Tunnel instead (deploy/Caddyfile.tunnel): see DOCS.md, section 11.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # The web address, plus the origins of the apps that carry the web app inside them: app://chatterly (desktop) and
      # https://chatterly.internal (Android) and capacitor://chatterly.internal (iOS); a reserved name that never exists on the internet.
      CORS_ORIGINS: https://${DOMAIN:-localhost},app://chatterly,https://chatterly.internal,capacitor://chatterly.internal
      JWT_SECRET: ${JWT_SECRET:-}
      SERVER_SECRET: ${SERVER_SECRET:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      ADMIN_USERS: ${ADMIN_USERS:-Jondals}
      # The secret the build uses to upload a beta installer (at least 32 characters; empty = uploading is off).
      BETA_UPLOAD_TOKEN: ${BETA_UPLOAD_TOKEN:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_TTL_SEC: ${TURN_TTL_SEC:-}
      # Cloudflare's managed TURN instead of the "turn" service below (nothing to run or open on this machine).
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      RELAY_ONLY: ${RELAY_ONLY:-}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    volumes:
      - chatterly-data:/data
    # * Hardening: the container only writes in its data volume and in memory, has no extra privileges and has no
    # capability of Linux (the app listens on ports above 1024 and needs none).
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 512
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:4200'
    expose:
      - '3000'
      - '4200'

  caddy:
    profiles: ['caddy']
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  chatterly-data:
  caddy-data:
  caddy-config:
