<!doctype html>
<html lang="en" data-accent="mint">
  <head>
    <meta charset="utf-8" />
    <title>Chatterly-Renewed</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Chatterly-Renewed — end-to-end encrypted chat, groups and peer-to-peer voice calls."
    />
    <meta name="theme-color" content="#06070b" />
    <meta name="referrer" content="no-referrer" />
    <!-- Search engines and social networks. __SITE_URL__ is the public address of the site: the build fills it in (SITE_URL). -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chatterly-Renewed" />
    <meta property="og:title" content="Chatterly-Renewed" />
    <meta
      property="og:description"
      content="Chat, groups and calls with end-to-end encryption. The server cannot read your messages or listen to your calls."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Chatterly-Renewed: end-to-end encrypted chat and calls"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chatterly-Renewed" />
    <meta
      name="twitter:description"
      content="Chat, groups and calls with end-to-end encryption. The server cannot read your messages or listen to your calls."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Chatterly-Renewed",
        "url": "__SITE_URL__/",
        "description": "End-to-end encrypted chat, groups and peer-to-peer voice and video calls.",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with WebCrypto and WebRTC",
        "inLanguage": ["en", "es"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <!-- Everything is self-hosted: no third-party scripts, fonts or trackers. API/WS may live on another origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream: https:; connect-src 'self' wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; frame-src https://embed.bsky.app https://embed.reddit.com https://clips.twitch.tv https://player.twitch.tv https://w.soundcloud.com https://geo.dailymotion.com https://streamable.com https://spinly-psi.vercel.app http://localhost:* http://127.0.0.1:* https://www.youtube-nocookie.com https://open.spotify.com https://player.vimeo.com https://www.instagram.com https://platform.twitter.com https://www.tiktok.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Not render-blocking (media="print"): the app switches it on when idle. The build rewrites the file name. -->
    <link href="lazy-fonts.css" rel="stylesheet" media="print" id="lazy-fonts" />
    <!-- The dark layer that covers the page from the very first paint until the introduction takes over (see arrival.service.ts). -->
    <style>
      #boot-cover {
        --a: var(--accent, #2ef2b0);
        --b: var(--accent-2, #a78bfa);
        --m: color-mix(in oklab, var(--a), var(--b));
        position: fixed;
        inset: 0;
        z-index: 299;
        overflow: hidden;
        background: #04070d;
      }
      #boot-cover::before {
        content: '';
        position: absolute;
        inset: -30%;
        background:
          radial-gradient(
            40% 35% at 25% 30%,
            color-mix(in oklab, var(--a) 33%, transparent),
            transparent 70%
          ),
          radial-gradient(
            35% 40% at 78% 35%,
            color-mix(in oklab, var(--b) 33%, transparent),
            transparent 70%
          ),
          radial-gradient(
            45% 35% at 55% 80%,
            color-mix(in oklab, var(--m) 27%, transparent),
            transparent 70%
          );
        opacity: 0;
        animation:
          boot-in 0.5s forwards,
          boot-sway 10s ease-in-out infinite alternate;
      }
      #boot-cover::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 44%;
        width: 18rem;
        height: 18rem;
        margin: -9rem;
        border-radius: 50%;
        background: radial-gradient(
          circle closest-side,
          color-mix(in oklab, var(--a) 33%, transparent),
          color-mix(in oklab, var(--b) 13%, transparent) 55%,
          transparent
        );
        opacity: 0;
        animation:
          boot-in 0.6s 0.2s forwards,
          cover-breathe 2.4s ease-in-out infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-sway {
        from {
          transform: translate(-4%, -3%);
        }
        to {
          transform: translate(4%, 3%) scale(1.08);
        }
      }
      @keyframes cover-breathe {
        50% {
          transform: scale(1.18);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-cover {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-cover"></div>
    <app-root></app-root>
  </body>
</html>
